<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <!-- Fondo propio: el diagrama se lee igual en temas claros y oscuros -->
  <rect x="0" y="0" width="820" height="430" rx="12" fill="#ffffff"/>
  <text x="24" y="36" font-size="18" font-weight="bold" fill="#111827">¿En qué thread se ejecuta cada método? (scripts/3-qthread/4_afinidad.py)</text>

  <!-- Thread principal -->
  <rect x="24" y="56" width="370" height="270" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="40" y="82" font-size="16" font-weight="bold" fill="#1e3a8a">Thread principal</text>
  <text x="40" y="101" font-size="12" fill="#1e3a8a">tiene el event loop: app.exec()</text>

  <rect x="44" y="116" width="330" height="70" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="60" y="141" font-size="14" font-weight="bold" fill="#111827">objeto ventana (MiVentana)</text>
  <text x="60" y="168" font-size="14" font-family="DejaVu Sans Mono, monospace" fill="#111827">actualizar_label()</text>

  <rect x="44" y="206" width="330" height="100" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="60" y="231" font-size="14" font-weight="bold" fill="#111827">objeto MiThread</text>
  <text x="60" y="251" font-size="12" fill="#374151">se creó en este thread, así que vive aquí</text>
  <text x="60" y="284" font-size="14" font-family="DejaVu Sans Mono, monospace" fill="#111827">tarea_pesada()</text>
  <text x="190" y="284" font-size="13" font-weight="bold" fill="#b91c1c">¡congela la GUI!</text>

  <!-- Thread secundario -->
  <rect x="426" y="56" width="370" height="270" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="442" y="82" font-size="16" font-weight="bold" fill="#7c2d12">Thread secundario</text>
  <text x="442" y="101" font-size="12" fill="#7c2d12">lo crea thread.start()</text>

  <rect x="446" y="116" width="330" height="70" rx="6" fill="#ffffff" stroke="#fdba74"/>
  <text x="462" y="143" font-size="15" font-weight="bold" font-family="DejaVu Sans Mono, monospace" fill="#111827">run()</text>
  <text x="462" y="168" font-size="13" fill="#111827">lo único que corre en este thread</text>

  <g font-size="13" fill="#374151">
    <text x="446" y="216">① run() emite senal_progreso: la señal</text>
    <text x="446" y="234">se encola y actualizar_label() se</text>
    <text x="446" y="252">ejecuta en el thread principal.</text>
    <text x="446" y="280">② la ventana emite senal_pedir_tarea:</text>
    <text x="446" y="298">tarea_pesada() se ejecuta donde vive el</text>
    <text x="446" y="316">objeto MiThread, el thread principal.</text>
  </g>

  <!-- Flechas -->
  <g stroke="#374151" stroke-width="2" fill="none">
    <line x1="444" y1="151" x2="380" y2="151" marker-end="url(#flecha)"/>
    <line x1="330" y1="188" x2="330" y2="202" marker-end="url(#flecha)"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#374151">
    <text x="403" y="143">①</text>
    <text x="340" y="200">②</text>
  </g>

  <!-- Regla -->
  <rect x="24" y="344" width="772" height="66" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <g font-size="14" fill="#111827">
    <text x="40" y="371"><tspan font-weight="bold">Regla:</tspan> un slot se ejecuta en el thread donde vive el objeto receptor (donde se creó),</text>
    <text x="40" y="393">no en el thread que emite la señal. De un QThread, solo run() corre en el thread nuevo.</text>
  </g>
</svg>
